# PAUSED 2026-08-12, ahead of the public flip.
#
# `open-pull-requests-limit: 0` is Dependabot's documented way to disable VERSION
# updates for an ecosystem. It is used here instead of deleting this file so that
# the config, and the traps recorded in it, survive the pause — restoring it is a
# one-character edit per ecosystem, back to 3.
#
# WHAT IS STILL ON: Dependabot security alerts and security updates. Those are a
# repository setting, not this file, so a real advisory still raises a PR. Only
# routine version bumps are paused.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0   # paused — was 3
    groups:
      # Batch the routine dev-tooling minor/patch bumps into one PR to cut noise.
      dev-tooling:
        patterns:
          - "@types/*"
          - "vitest"
          - "prettier"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Take these majors deliberately, not via auto-PR.
      # typescript: tsconfig is module=commonjs + moduleResolution=node, so TS6
      #   (drops node10) fails `tsc --noEmit` and dirties the ncc-built dist/.
      # @types/node: must track, not lead, the CI Node runtime.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0   # paused — was 3
    ignore:
      # Skip MAJOR github-actions bumps — they churn + break
      # (actions/checkout@v7 broke docs CI). Take majors deliberately + tested;
      # minor/patch (incl. security) still auto-PR.
      # FIX 2026-06-22: this ignore was previously at column 0 (a top-level key) and
      # therefore INERT — github-actions majors were NOT actually ignored here.
      # Re-nested under this update entry so the policy applies.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
