name: Release

on:
  push:
    tags:
      # Full semver only. This workflow force-moves the floating `v1` major tag;
      # triggering on a bare `v*` made the `v1` push re-run the workflow and race
      # its own `git push v1 --force` (cannot lock ref). `v*.*.*` excludes `v1`.
      - 'v*.*.*'

# Two tag pushes close together on 2026-08-16 raced: v1.1.1 went out first, then
# v1.1.0's job finished second and last-writer-wins left `v1` and the "Latest"
# flag pointing at the OLDER release, which is what the README badge reads. A
# concurrency group alone would only serialize them — the same wrong writer still
# wins, just later — so the ordering guard below is the half that actually fixes
# it, and the group exists to stop two jobs racing the same `git push --force`.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          # checkout defaults to fetch-tags: false, so `git tag -l` would see only
          # the tag being released and the guard below could never find a higher one.
          fetch-depth: 0
          fetch-tags: true

      - name: Refuse to move a major tag backwards
        # The mutation this protects is `git push origin v1 --force`, which every
        # consumer pinning @v1 follows. Releasing an older tag after a newer one is
        # always a mistake — a re-run, a late job, a backfilled tag — and it silently
        # downgrades everyone. Compare against the highest existing full-semver tag
        # in the same major and stop rather than regress.
        run: |
          set -euo pipefail
          MAJOR="${GITHUB_REF_NAME%%.*}"
          HIGHEST=$(git tag -l "${MAJOR}.*.*" \
            | grep -E "^v[0-9]+\.[0-9]+\.[0-9]+$" \
            | sort -V | tail -1)
          echo "releasing ${GITHUB_REF_NAME}; highest existing in ${MAJOR}: ${HIGHEST:-<none>}"
          if [ -n "${HIGHEST}" ] && [ "${HIGHEST}" != "${GITHUB_REF_NAME}" ]; then
            NEWEST=$(printf '%s\n%s\n' "${HIGHEST}" "${GITHUB_REF_NAME}" | sort -V | tail -1)
            if [ "${NEWEST}" != "${GITHUB_REF_NAME}" ]; then
              echo "::error::${GITHUB_REF_NAME} is older than ${HIGHEST}. Moving ${MAJOR} to it would downgrade every @${MAJOR} consumer. Refusing."
              exit 1
            fi
          fi

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Test + build
        run: |
          npm test
          npm run build

      - name: Update major-version tag
        # When releasing v1.2.3, also update the v1 tag so users can pin
        # to "@v1" and get patches automatically. Standard pattern for
        # GitHub Marketplace actions (see actions/checkout, actions/setup-node).
        run: |
          MAJOR=$(echo "${GITHUB_REF_NAME}" | cut -d. -f1)
          git config user.name "decimalai-bot"
          git config user.email "noreply@decimal.ai"
          git tag -fa "${MAJOR}" -m "Update ${MAJOR} tag to ${GITHUB_REF_NAME}"
          git push origin "${MAJOR}" --force

      - name: Create GitHub release
        # SHA-pinned, not @v2: this job holds contents: write and the step above
        # force-moves the `v1` tag that every consumer of this Action pins to. If
        # the mutable `v2` tag were ever moved to hostile code, that code would
        # inherit both — and could retag `v1` for every downstream user.
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        with:
          generate_release_notes: true
          draft: false
