name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: TypeScript tests + build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install
        run: npm ci

      - name: Type check
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      # dist/ is intentionally committed (GitHub Actions runtime consumes
      # it directly). Fail if rebuild produces a diff.
      - name: Verify dist/ is up to date
        run: |
          if [[ -n "$(git status --porcelain dist/)" ]]; then
            echo "ERROR: dist/ is out of date. Run 'npm run build' and commit."
            git diff dist/
            exit 1
          fi

  dogfood:
    name: Dogfood — exercise action against in-repo demo_agent
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Install the released package from PyPI, not a git ref. This job is a
      # dogfood run, so it should exercise the same SDK build users get from
      # `pip install decimalai` — a git ref would test unreleased code and hide
      # packaging breakage that only shows up in the published artifact.
      # The bundle in dist/ IS the artifact — it is what runs in every user's
      # workflow — and nothing here executed it. The build job only checks that
      # dist/ matches a fresh compile, which compares bytes and never asks
      # whether they run. A bundle that resolves no modules would pass that and
      # break for everyone on first use.
      #
      # These two assertions need no API key, so unlike the manifest step below
      # they run on every push and on forks. Each pins a documented contract:
      #   1. a missing required input is fatal and names the input;
      #   2. an unreachable backend under `on-error: warn` exits 0 and reports
      #      unavailable — our downtime is not the user's regression.
      - name: Smoke the built action
        run: |
          set -euo pipefail

          echo "--- missing required input must fail loudly"
          if node dist/index.js > out1.txt 2>&1; then
            echo "FAIL: expected a non-zero exit for a missing api-key"; cat out1.txt; exit 1
          fi
          grep -q '::error::.*api-key' out1.txt \
            || { echo "FAIL: no ::error:: naming api-key"; cat out1.txt; exit 1; }
          echo "ok"

          echo "--- unreachable backend with on-error:warn must stay green"
          env "INPUT_API-KEY=dai_sk_smoke_not_a_real_key" \
              "INPUT_AGENT-NAME=smoke-agent" \
              "INPUT_CANDIDATE-MANIFEST-ID=00000000-0000-4000-8000-000000000000" \
              "INPUT_BASE-URL=http://127.0.0.1:9" \
              "INPUT_ON-ERROR=warn" \
              node dist/index.js > out2.txt 2>&1 \
            || { echo "FAIL: on-error=warn must exit 0 when the backend is unreachable"; cat out2.txt; exit 1; }
          grep -qi 'unavailable' out2.txt \
            || { echo "FAIL: expected the run to report unavailable"; cat out2.txt; exit 1; }
          echo "ok"

          rm -f out1.txt out2.txt

      - name: Install decimalai SDK
        run: pip install decimalai

      - name: Manifest extraction (manifest_only mode)
        env:
          DECIMALAI_MODE: manifest_only
          DECIMAL_API_KEY: ${{ secrets.DECIMAL_API_KEY }}
          DECIMAL_BASE_URL: ${{ vars.DECIMAL_BASE_URL || 'https://api.decimal.ai' }}
          DEMO_AGENT_NAME: decimalai-demo-agent
        # Only run when the secret is configured. The `if` block reads from
        # `env` rather than `secrets` because GitHub doesn't allow direct
        # `secrets.X` in `if` expressions.
        if: ${{ env.DECIMAL_API_KEY != '' }}
        run: python scripts/init_for_decimal.py

      - name: Skip notice when no API key
        env:
          DECIMAL_API_KEY: ${{ secrets.DECIMAL_API_KEY }}
        if: ${{ env.DECIMAL_API_KEY == '' }}
        run: echo "DECIMAL_API_KEY not set — skipping dogfood manifest upload"

  audit:
    # Known-advisory check on the dependencies this Action ships to its users.
    # It runs in other people's CI, so a vulnerable production dependency is
    # their exposure and not only ours. --omit=dev because a dev-only advisory
    # does not reach anyone running the Action.
    #
    # Advisory for now: as of 2026-08-17 this reports 3 production findings
    # (undici HIGH, GHSA-g9mf-h72j-4rw9, plus two moderates), all reachable via
    # @actions/github and all fixed only by a major bump to 9.x. That bump needs
    # its own change with a dist/ rebuild, so gating on it today would just wedge
    # the repo.
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev
